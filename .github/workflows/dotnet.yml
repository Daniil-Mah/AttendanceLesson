name: .NET CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore AttendanceLesson/AttendanceLesson.csproj

    - name: Build project
      run: dotnet build AttendanceLesson/AttendanceLesson.csproj --no-restore --configuration Release

    - name: Run unit tests with coverage
      run: dotnet test AttendanceLesson/AttendanceLesson.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --logger "junit;LogFilePath=test-results/{assembly}.xml"

    - name: Generate Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: '**/coverage.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'HtmlInline;MarkdownSummaryGithub'

    - name: Upload Coverage Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeCoverageReport
        path: coveragereport

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: '**/test-results/*.xml'
        reporter: dotnet-trx
